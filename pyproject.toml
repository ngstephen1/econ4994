[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fair-lending-capstone"
version = "0.1.0"
description = "Synthetic-first research on fairness and disparities in mortgage lending decisions"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "threadpoolctl>=3.2",
    "statsmodels>=0.14",
    "pyarrow>=14",
    "PyYAML>=6",
    "matplotlib>=3.8",
    "plotly>=5.18",
    "streamlit>=1.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
